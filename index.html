<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MindAR Desktop Fix</title>

  <script src="aframe.min.js"></script>
  <script src="mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: book.mind;"
  embedded
  vr-mode-ui="false"
  device-orientation-permission-ui="false"
  renderer="colorManagement: true, physicallyCorrectLights"
  color-space="sRGB"
>

  <a-assets>
    <a-asset-item id="modelAsset" src="Nike.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-entity
      gltf-model="#modelAsset"
      position="0 0 0"
      rotation="0 0 0"
      scale="0 0 0"
      animation="property: scale; to: 0.5 0.5 0.5; dur: 800; easing: easeOutBack; startEvents: targetFound"
      animation__hide="property: scale; to: 0 0 0; dur: 300; easing: easeInBack; startEvents: targetLost">
    </a-entity>

  </a-entity>

</a-scene>

</body>
</html>
