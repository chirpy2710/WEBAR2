<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="./components.js"></script>
    <style>
      #overlay {
        position: fixed;
        top: 100px;
        padding: 10px;
        z-index: 1001;
      }

      #instructions {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.5);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        text-align: center;
        z-index: 1001;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <a-scene
      webxr="requiredFeatures:hit-test; optionalFeatures:dom-overlay; referenceSpaceType:local; overlayElement:#overlay"
      background="transparent: true">

      <a-entity
        id="box"
        gltf-model="https://raw.githubusercontent.com/chirpy2710/ARwebnew/main/model.glb"
        scale="0.1 0.1 0.1"
        visible="false">
      </a-entity>

      <a-entity
        ar-reticle
        geometry="primitive: ring; radiusInner: 0.15; radiusOuter: 0.2"
        rotation="-90 0 0"
        visible="false">
      </a-entity>
    </a-scene>

    <div id="overlay"></div>
    <div id="instructions">👆 Tap to place &nbsp;|&nbsp; 🤏 Pinch to scale &nbsp;|&nbsp; 👆👆 Two fingers to rotate</div>

    <script>
      const model = document.getElementById('box');

      // Current transform state
      let currentScale = 0.1;
      let currentRotationY = 0;

      // Touch state
      let lastPinchDistance = null;
      let lastRotationAngle = null;
      let activeTouches = [];

      function getTouchDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function getTouchAngle(t1, t2) {
        return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * (180 / Math.PI);
      }

      document.addEventListener('touchstart', (e) => {
        activeTouches = Array.from(e.touches);
        if (activeTouches.length === 2) {
          lastPinchDistance = getTouchDistance(activeTouches[0], activeTouches[1]);
          lastRotationAngle = getTouchAngle(activeTouches[0], activeTouches[1]);
        }
      });

      document.addEventListener('touchmove', (e) => {
        e.preventDefault();
        activeTouches = Array.from(e.touches);

        if (activeTouches.length === 2) {
          const isVisible = model.getAttribute('visible');
          if (!isVisible) return;

          // --- Pinch to Scale ---
          const newDistance = getTouchDistance(activeTouches[0], activeTouches[1]);
          if (lastPinchDistance !== null) {
            const scaleFactor = newDistance / lastPinchDistance;
            currentScale = Math.min(Math.max(currentScale * scaleFactor, 0.02), 2.0);
            model.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
          }
          lastPinchDistance = newDistance;

          // --- Two Finger Rotate ---
          const newAngle = getTouchAngle(activeTouches[0], activeTouches[1]);
          if (lastRotationAngle !== null) {
            const deltaAngle = newAngle - lastRotationAngle;
            currentRotationY += deltaAngle;
            model.setAttribute('rotation', `0 ${currentRotationY} 0`);
          }
          lastRotationAngle = newAngle;
        }
      }, { passive: false });

      document.addEventListener('touchend', (e) => {
        activeTouches = Array.from(e.touches);
        if (activeTouches.length < 2) {
          lastPinchDistance = null;
          lastRotationAngle = null;
        }
      });
    </script>
  </body>
</html>
